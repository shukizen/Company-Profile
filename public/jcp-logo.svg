<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-labelledby="title desc">
  <title id="title">JCP</title>
  <desc id="desc">Jogja Creative Production, established 2022</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#17191e"/>
      <circle cx="1.2" cy="1.4" r=".8" fill="#f7f9fc" opacity=".68"/>
      <circle cx="5.3" cy="3.8" r=".65" fill="#f7f9fc" opacity=".48"/>
      <circle cx="2.8" cy="6" r=".55" fill="#f7f9fc" opacity=".5"/>
    </pattern>
  </defs>
  <text x="9" y="119" font-family="Arial Black, Arial, sans-serif" font-size="118" font-weight="900" letter-spacing="-10" fill="url(#grain)" stroke="#17191e" stroke-width="2" paint-order="stroke fill">JCP</text>
  <text x="160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#17191e">JOGJA CREATIVE PRODUCTION</text>
  <text x="160" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7" fill="#17191e">ESTD 2022</text>
