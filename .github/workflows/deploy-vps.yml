name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: jcpwebsolutions.duckdns.org
      VPS_USER: jogjacreativepro
      VPS_DEPLOY_DIR: /home/jogjacreativepro/company-profile-site
      VPS_HOST_KEY_SHA256: SHA256:Ez+g6N32YJk6GP0b9DNuxh3RGFYAvADOdNGw00MiBec
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure and verify SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "Add the VPS_SSH_KEY secret in GitHub repository settings before deploying." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -T 10 -t ed25519 "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 {print $2}')"
          if [ "$ACTUAL_FINGERPRINT" != "$VPS_HOST_KEY_SHA256" ]; then
            echo "VPS host fingerprint did not match the pinned fingerprint." >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync site files to VPS
        run: |
          set -euo pipefail
          rsync -az --delete-delay \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env*' \
            --exclude='*.tsbuildinfo' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/"

      - name: Build and restart the site
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_DIR' && docker compose -f compose.duckdns.yml up -d --build"

      - name: Verify public HTTPS site
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://jcpwebsolutions.duckdns.org/
